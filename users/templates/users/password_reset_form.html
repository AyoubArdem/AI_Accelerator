{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-1: #f8fbff;
            --bg-2: #edf4ff;
            --ink: #0b1220;
            --muted: #4a5b77;
            --line: #d5e2ff;
            --brand: #1f5eff;
            --brand-2: #0d3bb8;
            --card: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, #dfeaff 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, #d9ecff 0%, transparent 30%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 25px 70px rgba(15, 30, 75, 0.12);
        }
        h1 {
            margin: 8px 0 10px;
            font-size: 26px;
        }
        p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
        }
        .btn {
            margin-top: 14px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            cursor: pointer;
        }
        .hint {
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <form method="post">
            {% csrf_token %}
            <label for="password">New password</label>
            <input id="password" name="password" type="password" minlength="8" required />
            <button class="btn" type="submit">Reset Password</button>
        </form>
        <div class="hint">For security, links expire and can be used once.</div>
    </main>
</body>
</html>

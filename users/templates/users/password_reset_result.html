{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-1: #f8fbff;
            --bg-2: #edf4ff;
            --ink: #0b1220;
            --muted: #4a5b77;
            --line: #d5e2ff;
            --brand: #1f5eff;
            --ok: #0f766e;
            --ok-bg: #e9fffb;
            --bad: #b42318;
            --bad-bg: #fff2f0;
            --card: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, #dfeaff 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, #d9ecff 0%, transparent 30%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 25px 70px rgba(15, 30, 75, 0.12);
        }
        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .tag.ok { color: var(--ok); background: var(--ok-bg); }
        .tag.bad { color: var(--bad); background: var(--bad-bg); }
        h1 {
            margin: 10px 0 10px;
            font-size: 24px;
        }
        p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="tag {% if is_success %}ok{% else %}bad{% endif %}">{{ status_label }}</span>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
    </main>
</body>
</html>

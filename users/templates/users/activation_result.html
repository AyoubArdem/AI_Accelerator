{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-1: #f8fbff;
            --bg-2: #edf4ff;
            --ink: #0b1220;
            --muted: #4a5b77;
            --line: #d5e2ff;
            --brand: #1f5eff;
            --brand-2: #0d3bb8;
            --ok: #0f766e;
            --ok-bg: #e9fffb;
            --bad: #b42318;
            --bad-bg: #fff2f0;
            --card: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 10%, #dfeaff 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, #d9ecff 0%, transparent 30%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 25px 70px rgba(15, 30, 75, 0.12);
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: var(--brand-2);
            letter-spacing: 0.2px;
        }

        .logo-wrap {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 1px solid #c9daff;
            background: #f4f8ff;
            display: grid;
            place-items: center;
            padding: 6px;
            flex: 0 0 auto;
        }

        .logo {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .tag {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .tag.ok { color: var(--ok); background: var(--ok-bg); }
        .tag.bad { color: var(--bad); background: var(--bad-bg); }

        h1 {
            margin: 8px 0 10px;
            font-size: 30px;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            text-decoration: none;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #bfd5ff;
            color: #12307a;
            background: #ecf4ff;
        }

        .btn.primary {
            color: #ffffff;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            border-color: #2450d9;
        }

        .hint {
            margin-top: 14px;
            font-size: 13px;
            color: #36507e;
        }

        .code {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d7e4ff;
            background: #f5f9ff;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            color: #12307a;
            overflow-x: auto;
            white-space: pre;
        }

        @media (max-width: 640px) {
            .card { padding: 20px; border-radius: 18px; }
            .brand-row { flex-direction: column; align-items: flex-start; }
            .logo-wrap { width: 48px; height: 48px; padding: 5px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand-row">
            <div class="brand">
                <div class="logo-wrap">
                    <img class="logo" src="{% static 'users/logo.png' %}" alt="AIAC logo" />
                </div>
                <span>AIAC - AI Accelerator</span>
            </div>
            <span class="tag {% if is_success %}ok{% else %}bad{% endif %}">{{ status_label }}</span>
        </div>

        <h1>{{ title }}</h1>
        <p>{{ message }}</p>

        <div class="actions">
            <button class="btn primary" type="button" onclick="copyCmd('aiac auth login')">Copy Login Command</button>
            <button class="btn" type="button" onclick="copyCmd('aiac auth me')">Copy Profile Command</button>
        </div>
        <div class="hint" id="copy-status">Use these commands in your terminal after login:</div>
        <div class="code">aiac --help
aiac server --help
aiac auth --help
aiac deployment --help
aiac monitoring --help
aiac governance --help
aiac admin --help</div>
    </main>
    <script>
        function copyCmd(cmd) {
            navigator.clipboard.writeText(cmd).then(function () {
                const el = document.getElementById("copy-status");
                el.textContent = "Copied to clipboard: " + cmd;
            }).catch(function () {
                const el = document.getElementById("copy-status");
                el.textContent = "Copy failed. Please copy manually: " + cmd;
            });
        }
    </script>
</body>
</html>

version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_NAME=ai_accelerator
      - DB_USER=ai_user
      - DB_PASSWORD=ai_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    networks:
      - ai-accelerator

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ai-accelerator

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ai_accelerator
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_accelerator"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-accelerator

  # Optional: Celery worker
  celery:
    build: .
    command: celery -A AI_Accelerator worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_NAME=ai_accelerator
      - DB_USER=ai_user
      - DB_PASSWORD=ai_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ai-accelerator

volumes:
  redis_data:
  postgres_data:

networks:
  ai-accelerator:
    driver: bridge

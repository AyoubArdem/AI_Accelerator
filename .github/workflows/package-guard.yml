name: Package Guard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Verify wheel runtime files
        run: python scripts/verify_wheel_contents.py --wheel "dist/*.whl"


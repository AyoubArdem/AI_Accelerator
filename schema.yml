components:
  schemas:
    ActionEnum:
      enum:
      - DEPLOY
      - STOP
      - DRIFT_DETECTED
      type: string
      description: |-
        * `DEPLOY` - Deploy Model
        * `STOP` - Stop Deployment
        * `DRIFT_DETECTED` - Data Drift Detected
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        policy_violation:
          type: integer
          nullable: true
        message:
          type: string
          maxLength: 300
        sent:
          type: boolean
          readOnly: true

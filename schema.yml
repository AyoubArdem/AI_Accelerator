openapi: 3.0.3
info:
  title: AI_Accelerator
  version: 1.0.0
  description: AI Accelerator is a SaaS platform designed to help small and medium-sized
    enterprises (SMEs) accelerate the adoption of Artificial Intelligence by simplifying
    the process of deploying, monitoring, and managing AI models. The platform bridges
    the gap between AI experimentation and production, enabling companies to leverage
    AI effectively without requiring large ML/DevOps teams.
